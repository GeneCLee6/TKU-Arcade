<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>TKU Arcade</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: #06070f;
        color: #eef1ff;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      img { width: 72px; height: 72px; }
      h1 { font-size: 24px; margin: 16px 0 8px; }
      p { margin: 4px 0; color: #a6aed6; }
      button {
        margin-top: 20px;
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        background: #2be6ff;
        color: #06070f;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>需要網路 · You are offline</h1>
      <p>TKU Arcade 要連上網路才能開房和玩。</p>
      <p lang="en">TKU Arcade needs a connection to open rooms and play.</p>
      <button type="button" onclick="location.reload()">再試一次 · Try again</button>
    </main>
  </body>
</html>
