name: CI

# Runs on pull requests targeting main and on every push to main: install -> lint -> typecheck ->
# test -> build -> JS budgets (AC-12.2). All must pass before a pull request can merge; production
# deploys run in deploy.yml after this workflow succeeds on main (DEPLOY.md §4).
#
# Steps still to come, each added by the batch that adds its npm script (don't call them before):
#   - B1:           `npm run check-i18n` — en.ts and zh-TW.ts have the same keys
#   - K1 (e12-t08): `npm run check-assets` — every file in public/ and R2 is listed in ASSETS.md
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests (Vitest)
        run: npm test

      - name: Production build
        env:
          APP_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build

      - name: JS budgets
        run: npm run budget
