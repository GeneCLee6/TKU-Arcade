name: CI

# Runs on pull requests targeting main and on every push to main: install -> lint -> translations ->
# typecheck -> test -> build -> JS budgets (AC-12.2). All must pass before a pull request can merge;
# production deploys run in deploy.yml after this workflow succeeds on main (DEPLOY.md §4).
#
# Steps still to come, each added by the batch that adds its npm script (don't call them before):
#   - K1 (e12-t08): `npm run check-assets` — every file in public/ and R2 is listed in ASSETS.md
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Translations (check-i18n)
        run: npm run check-i18n

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests (Vitest)
        run: npm test

      - name: Production build
        env:
          APP_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build

      - name: JS budgets
        run: npm run budget

  # e7-t10 (AC-7.8): visual regression and axe. The real app on Vite's dev server, its API answered by
  # fixtures (e2e-visual/pages.visual.ts), screenshotted in Playwright's container so that fonts
  # match the baselines in e2e-visual/__screenshots__. When a screenshot differs, the diffs and a
  # fresh set of baselines are uploaded as the `visual` artifact: if the change was meant, commit
  # those baselines (playwright.visual.config.ts says how).
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Screenshots and axe
        id: compare
        run: npm run test:visual

      - name: New baselines, for a change meant to look different
        if: failure() && steps.compare.outcome == 'failure'
        run: npm run test:visual -- --update-snapshots || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual
          path: |
            test-results/
            playwright-report/
            e2e-visual/__screenshots__/
          retention-days: 7
