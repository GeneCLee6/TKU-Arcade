name: CI

# Runs on pull requests targeting main and on every push to main: install -> lint -> translations ->
# typecheck -> test -> build -> JS budgets (AC-12.2). All must pass before a pull request can merge;
# production deploys run in deploy.yml after this workflow succeeds on main (DEPLOY.md §4).
#
# Steps still to come, each added by the batch that adds its npm script (don't call them before):
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Translations (check-i18n)
        run: npm run check-i18n

      - name: Assets listed (check-assets)
        run: npm run check-assets

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests (Vitest)
        run: npm test

      - name: Production build
        env:
          APP_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build

      - name: JS budgets
        run: npm run budget

  # e7-t10 (AC-7.8): visual regression and axe. The real app on Vite's dev server, its API answered by
  # fixtures (e2e-visual/pages.visual.ts), screenshotted in Playwright's container so that fonts
  # match the baselines in e2e-visual/__screenshots__. When a screenshot differs, the diffs and a
  # fresh set of baselines are uploaded as the `visual` artifact: if the change was meant, commit
  # those baselines (playwright.visual.config.ts says how).
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Screenshots and axe
        id: compare
        run: npm run test:visual

      - name: New baselines, for a change meant to look different
        if: failure() && steps.compare.outcome == 'failure'
        run: npm run test:visual -- --update-snapshots || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual
          path: |
            test-results/
            playwright-report/
            e2e-visual/__screenshots__/
          retention-days: 7

  # The board games' sweep, light version (docs/QA-SWEEP-2026-11.md): every listed board game, at its
  # fewest players, from the waiting room through a whole game of random legal moves to the result
  # and a rematch, through the real Worker and RoomDO on Vite's dev server. Desktop only, axe on the
  # desktop; the two phone sizes run locally (`npm run test:sweep`). About five minutes. Before it, the
  # phone layout checks (e2e/mobile.spec.ts, 2026-11-23): the lobby's first screen, the waiting room,
  # a game and its result at 375 px. About a minute and a half.
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      # The local D1 the dev server uses, with the production tables (results, flags, metrics)
      - name: Local database
        run: npx wrangler d1 migrations apply DB --local --config wrangler.jsonc

      - name: Phone layout (375 px)
        env:
          E2E_PORT: '5199'
        run: npx playwright test mobile.spec.ts --workers=1

      - name: Every board game to its end
        env:
          SWEEP_SCREENS: desktop
          SWEEP_AXE: desktop
        run: npm run test:sweep

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: sweep
          path: |
            test-results/
            playwright-report/
            tmp/sweep/
          retention-days: 7
