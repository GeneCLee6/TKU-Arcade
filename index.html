<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Dark until the styles say otherwise: the default look (E1) -->
    <meta name="color-scheme" content="dark" />
    <!-- The display faces' files come from here (src/styles/webFonts.ts); connecting early costs nothing -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The mark (docs/ASSETS.md): SVG where the browser takes it, a PNG where not, and the home-screen icon -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable as an app (e7-t09): the manifest, the bar colour and iOS's home-screen mode -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#06070F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TKU Arcade" />
    <title>TKU Arcade</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
